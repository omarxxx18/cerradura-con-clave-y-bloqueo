<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cerradura con clave y bloqueo · Máquina de estado</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#16202e;--muted:#5f6b7c;--line:#9aa7ba;--node:#eaf1fb;--nodeLine:#2f5597;--accent:#2f5597;--accentSoft:#cfe0fb;--ok:#2e7d32;--okSoft:#d6efd8;--bad:#c62828;--badSoft:#f9d6d6;--bdr:#d7deea;--chip:#eef2f8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1420;--card:#171f2e;--text:#e6ecf5;--muted:#9fb0c6;--line:#6d7f98;--node:#1d2a40;--nodeLine:#7fa7e8;--accent:#7fb0ff;--accentSoft:#27456f;--ok:#66bb6a;--okSoft:#1f4a2a;--bad:#ef5350;--badSoft:#5a2326;--bdr:#2a3750;--chip:#202b3e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1420;--card:#171f2e;--text:#e6ecf5;--muted:#9fb0c6;--line:#6d7f98;--node:#1d2a40;--nodeLine:#7fa7e8;--accent:#7fb0ff;--accentSoft:#27456f;--ok:#66bb6a;--okSoft:#1f4a2a;--bad:#ef5350;--badSoft:#5a2326;--bdr:#2a3750;--chip:#202b3e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.4}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:1.45rem;margin:0 0 2px}
.sub{color:var(--muted);margin:0 0 14px;font-size:.95rem}
.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:14px}
.card h2{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
svg{display:block;width:100%;height:auto}
.edge{fill:none;stroke:var(--line);stroke-width:2;transition:stroke .2s}
.edge.on{stroke:var(--accent);stroke-width:3.5}
.elabel{font:700 15px system-ui,sans-serif;fill:var(--muted);text-anchor:middle;dominant-baseline:middle}
.elabel.on{fill:var(--accent)}
.node circle{fill:var(--node);stroke:var(--nodeLine);stroke-width:2.5;transition:all .3s}
.node text{font:600 13px system-ui,sans-serif;fill:var(--text);text-anchor:middle;dominant-baseline:middle}
.node.on circle{fill:var(--accentSoft);stroke-width:5;filter:drop-shadow(0 0 8px var(--accent))}
.node.Abierta circle{stroke:var(--ok)}
.node.Abierta.on circle{fill:var(--okSoft);filter:drop-shadow(0 0 8px var(--ok))}
.node.Bloqueada circle{stroke:var(--bad)}
.node.Bloqueada.on circle{fill:var(--badSoft);filter:drop-shadow(0 0 8px var(--bad))}
.node.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#tk{fill:var(--accent);stroke:var(--card);stroke-width:2}
.panel{text-align:center}
.sname{font-size:1.5rem;font-weight:800;margin:4px 0 8px}
.lockbody{fill:var(--accent);transition:fill .3s}
.st-Abierta .lockbody{fill:var(--ok)}
.st-Bloqueada .lockbody{fill:var(--bad)}
#shackle{transition:transform .45s cubic-bezier(.3,1.4,.5,1);transform-origin:86px 62px}
.st-Abierta #shackle{transform:translateY(-14px) rotate(-22deg)}
.led{fill:#e53935;transition:fill .3s}
.st-Abierta .led{fill:#43a047}
.st-Bloqueada .led{animation:blink .45s infinite alternate}
@keyframes blink{from{opacity:1}to{opacity:.15}}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.chip{background:var(--chip);border-radius:10px;padding:7px 4px;font-size:.85rem}
.chip small{display:block;color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em}
.alarm{border-radius:10px;padding:6px;font-weight:700;font-size:.9rem;background:var(--chip);color:var(--muted);transition:all .3s}
.st-Bloqueada .alarm{background:var(--bad);color:#fff;animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.04)}}
.dots{margin-top:10px;font-size:.85rem;color:var(--muted)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--bad);margin:0 3px;vertical-align:middle;transition:background .3s}
.dot.f{background:var(--bad)}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.btn{flex:1 1 150px;font:inherit;font-weight:600;padding:12px 10px;border-radius:12px;border:2px solid var(--bdr);background:var(--card);color:var(--text);cursor:pointer;transition:transform .1s,border-color .2s}
.btn b{display:block;font-size:1.3rem;color:var(--accent)}
.btn small{color:var(--muted);font-weight:500}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:default}
.btn.s{flex:0 1 auto;padding:12px 18px}
#msg{min-height:1.4em;font-weight:600;margin:0 0 12px}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{border:1px solid var(--bdr);padding:6px 4px;text-align:center}
th{background:var(--chip)}
tr.cur td,tr.cur th{background:var(--accentSoft)}
td.hit{animation:hit 1.2s;font-weight:700}
@keyframes hit{0%{background:var(--accent);color:var(--card)}100%{}}
ul{list-style:none;margin:0;padding:0;font-size:.88rem;max-height:210px;overflow:auto}
li{padding:5px 0;border-bottom:1px solid var(--bdr)}
li span{color:var(--accent);font-weight:700}
.tw{overflow-x:auto}
</style>
</head>
<body>
<div class="wrap">
  <h1>Cerradura con clave y bloqueo</h1>
  <p class="sub">Máquina de estado tipo Moore: las salidas dependen solo del estado. Pulsa los botones o las teclas C, X, T y M.</p>

  <div class="grid">
    <div class="card">
      <h2>Diagrama de estados</h2>
      <svg id="d" viewBox="0 0 720 335" role="img" aria-label="Diagrama de estados de la cerradura"></svg>
    </div>
    <div class="card panel" id="panel">
      <h2>Cerradura</h2>
      <svg viewBox="0 0 120 125" style="width:120px;margin:0 auto" aria-hidden="true">
        <path id="shackle" d="M34 62V42a26 26 0 0 1 52 0V62" fill="none" stroke="var(--muted)" stroke-width="9" stroke-linecap="round"/>
        <rect class="lockbody" x="22" y="60" width="76" height="58" rx="10"/>
        <circle cx="60" cy="86" r="7" fill="var(--card)"/><rect x="57" y="88" width="6" height="16" rx="2" fill="var(--card)"/>
      </svg>
      <div class="sname" id="sname"></div>
      <div class="chips">
        <div class="chip"><small>Cerrojo</small><span id="o0"></span></div>
        <div class="chip"><small>LED</small><svg viewBox="0 0 20 20" style="width:16px;display:inline;vertical-align:middle"><circle class="led" cx="10" cy="10" r="8"/></svg> <span id="o1"></span></div>
        <div class="chip"><small>Alarma</small><span id="o2"></span></div>
      </div>
      <div class="alarm" id="alarm">ALARMA APAGADA</div>
      <div class="dots">Fallos seguidos: <span id="dots"></span></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" data-i="C"><b>C</b>Código correcto</button>
    <button class="btn" data-i="X"><b>X</b>Código incorrecto</button>
    <button class="btn" data-i="T"><b>T</b>Cerrar puerta</button>
    <button class="btn" data-i="M"><b>M</b>Llave maestra</button>
    <button class="btn s" id="demo">▶ Demo automática</button>
    <button class="btn s" id="reset">↺ Reiniciar</button>
  </div>
  <p id="msg"></p>

  <div class="grid">
    <div class="card tw">
      <h2>Tabla de transiciones</h2>
      <table id="tb"></table>
    </div>
    <div class="card">
      <h2>Historial</h2>
      <ul id="log"></ul>
    </div>
  </div>
</div>

<script>
const R = 38;
const N = {Cerrada0:[80,120], Cerrada1:[240,120], Cerrada2:[400,120], Bloqueada:[610,120], Abierta:[240,285]};
const ORDER = ['Cerrada0','Cerrada1','Cerrada2','Abierta','Bloqueada'];
const INPUTS = ['C','X','T','M'];
// Tabla de transiciones: estado -> entrada -> siguiente estado
const T = {
  Cerrada0:{C:'Abierta',X:'Cerrada1',T:'Cerrada0',M:'Cerrada0'},
  Cerrada1:{C:'Abierta',X:'Cerrada2',T:'Cerrada1',M:'Cerrada1'},
  Cerrada2:{C:'Abierta',X:'Bloqueada',T:'Cerrada2',M:'Cerrada2'},
  Abierta:{C:'Abierta',X:'Abierta',T:'Cerrada0',M:'Abierta'},
  Bloqueada:{C:'Bloqueada',X:'Bloqueada',T:'Bloqueada',M:'Cerrada0'}
};
// Salidas Moore: estado -> [cerrojo, LED, alarma]
const OUT = {
  Cerrada0:['Cerrado','Rojo','Apagada'], Cerrada1:['Cerrado','Rojo','Apagada'], Cerrada2:['Cerrado','Rojo','Apagada'],
  Abierta:['Abierto','Verde','Apagada'], Bloqueada:['Cerrado','Parpadea','Encendida']
};
const FAILS = {Cerrada0:0, Cerrada1:1, Cerrada2:2, Abierta:0, Bloqueada:3};
// Flechas dibujadas: [desde, entrada, punto de control, desplazamiento de la etiqueta]
const E = [
  ['Cerrada0','X',[160,120],[0,-14]], ['Cerrada1','X',[320,120],[0,-14]], ['Cerrada2','X',[505,120],[0,-14]],
  ['Cerrada0','C',[110,235],[-14,6]], ['Cerrada1','C',[240,201],[14,0]], ['Cerrada2','C',[320,201],[12,-6]],
  ['Abierta','T',[190,165],[14,-2]], ['Bloqueada','M',[345,-55],[0,-8]]
];
let cur = 'Cerrada0', busy = false, hist = [], lastCell = null;
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

function geo(e){
  const a = N[e[0]], b = N[T[e[0]][e[1]]], c = e[2];
  const u = (p,q,d) => { const dx=q[0]-p[0], dy=q[1]-p[1], l=Math.hypot(dx,dy); return [p[0]+dx/l*d, p[1]+dy/l*d]; };
  const s = u(a,c,R), en = u(b,c,R+5);
  return {d:`M${s[0]} ${s[1]}Q${c[0]} ${c[1]} ${en[0]} ${en[1]}`, m:[.25*s[0]+.5*c[0]+.25*en[0], .25*s[1]+.5*c[1]+.25*en[1]]};
}

function build(){
  let h = `<defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--line)"/></marker>
    <marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--accent)"/></marker></defs>
    <path class="edge" d="M6 120H38" marker-end="url(#ar)"/><text class="elabel" x="22" y="104">inicio</text>`;
  E.forEach(e => {
    const g = geo(e), id = e[0]+'-'+e[1];
    h += `<path class="edge" id="e-${id}" d="${g.d}" marker-end="url(#ar)"/>
          <text class="elabel" id="l-${id}" x="${g.m[0]+e[3][0]}" y="${g.m[1]+e[3][1]}">${e[1]}</text>`;
  });
  ORDER.forEach(s => {
    h += `<g class="node ${s}" id="n-${s}"><circle cx="${N[s][0]}" cy="${N[s][1]}" r="${R}"/><text x="${N[s][0]}" y="${N[s][1]}">${s}</text></g>`;
  });
  h += `<circle id="tk" r="7" cx="0" cy="0" style="display:none"/>`;
  $('d').innerHTML = h;

  let t = '<tr><th>Estado</th>' + INPUTS.map(i => `<th>${i}</th>`).join('') + '</tr>';
  ORDER.forEach(s => { t += `<tr id="r-${s}"><th>${s}</th>` + INPUTS.map(i => `<td id="c-${s}-${i}">${T[s][i]}</td>`).join('') + '</tr>'; });
  $('tb').innerHTML = t;
}

function render(){
  ORDER.forEach(s => { $('n-'+s).classList.toggle('on', s === cur); $('r-'+s).classList.toggle('cur', s === cur); });
  $('panel').className = 'card panel st-' + cur;
  $('sname').textContent = cur;
  [0,1,2].forEach(k => $('o'+k).textContent = OUT[cur][k]);
  $('alarm').textContent = cur === 'Bloqueada' ? 'ALARMA ENCENDIDA' : 'ALARMA APAGADA';
  $('dots').innerHTML = [0,1,2].map(k => `<span class="dot ${k < FAILS[cur] ? 'f' : ''}"></span>`).join('');
  $('log').innerHTML = hist.map(x => `<li><b>${x[0]}</b> <span>—${x[1]}→</span> <b>${x[2]}</b>${x[0]===x[2] ? ' <i>(sin cambio)</i>' : ''}</li>`).join('');
}

function clearOn(){
  document.querySelectorAll('.edge.on,.elabel.on').forEach(el => { el.classList.remove('on'); if (el.tagName === 'path') el.setAttribute('marker-end','url(#ar)'); });
}

function travel(e){
  const id = e[0]+'-'+e[1], p = $('e-'+id), tk = $('tk');
  clearOn();
  p.classList.add('on'); p.setAttribute('marker-end','url(#arA)'); $('l-'+id).classList.add('on');
  const L = p.getTotalLength(); tk.style.display = '';
  return new Promise(res => {
    const t0 = performance.now(), D = 650;
    (function f(now){
      const k = Math.min(1, (now - t0) / D), q = p.getPointAtLength(L * (k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2));
      tk.setAttribute('cx', q.x); tk.setAttribute('cy', q.y);
      if (k < 1) requestAnimationFrame(f); else { tk.style.display = 'none'; res(); }
    })(t0);
  });
}

function why(f, i, t){
  if (f === 'Bloqueada' && i !== 'M') return 'La cerradura bloqueada ignora esta entrada: solo la llave maestra la libera.';
  if (i === 'M' && f === 'Bloqueada') return 'Llave maestra: se desbloquea y vuelve a Cerrada0.';
  if (t === 'Abierta' && f !== 'Abierta') return 'Código correcto: se abre el cerrojo.';
  if (i === 'X' && t === 'Bloqueada') return 'Tercer fallo seguido: se activa la alarma.';
  if (i === 'X' && f !== 'Abierta') return 'Código incorrecto: fallo ' + FAILS[t] + ' de 3.';
  if (i === 'T' && f === 'Abierta') return 'Puerta cerrada: vuelve a Cerrada0.';
  return 'Sin cambio: esta entrada no provoca transición en este estado.';
}

function setBusy(v){ busy = v; document.querySelectorAll('button').forEach(b => b.disabled = v); }

async function fire(i){
  if (busy) return;
  setBusy(true);
  const f = cur, t = T[f][i];
  if (lastCell) lastCell.classList.remove('hit');
  lastCell = $(`c-${f}-${i}`); void lastCell.offsetWidth; lastCell.classList.add('hit');
  const e = E.find(x => x[0] === f && x[1] === i);
  if (e) await travel(e);
  else { clearOn(); const n = $('n-'+f); n.classList.add('shake'); await sleep(380); n.classList.remove('shake'); }
  cur = t; hist.unshift([f, i, t]); hist = hist.slice(0, 12);
  $('msg').textContent = `${f} + ${i} → ${t}. ` + why(f, i, t);
  render(); setBusy(false);
}

function reset(){ cur = 'Cerrada0'; hist = []; clearOn(); $('msg').textContent = 'Estado inicial: Cerrada0.'; render(); }

async function demo(){
  if (busy) return;
  reset();
  for (const i of 'XXXCMCT'){ await sleep(700); await fire(i); }
}

build(); render();
document.querySelectorAll('[data-i]').forEach(b => b.onclick = () => fire(b.dataset.i));
$('demo').onclick = demo; $('reset').onclick = () => { if (!busy) reset(); };
addEventListener('keydown', ev => { const k = ev.key.toUpperCase(); if (INPUTS.includes(k) && !ev.ctrlKey && !ev.metaKey) fire(k); });
</script>
</body>
</html>
